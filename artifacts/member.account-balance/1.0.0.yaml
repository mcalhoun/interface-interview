# Capability Artifact — member.account-balance 1.0.0
#
# Read this document instead of the code. It is meant to be approvable on its own:
# what the capability does, what it needs, what it returns, how each step verifies
# itself, and why each control is identified the way it is.
#
# Immutable. A change is a new version file beside this one, so 1.0.0 and 1.1.0
# can be diffed and the difference read directly.

capability: member.account-balance
version: 1.0.0
title: Read a member's primary savings balance
authored: hand-written

summary: >
  Looks a member up by number in Heritage Core Member Services, opens their
  primary savings account, and reads back the available and current balances.

  Returns two balances when the member exists, and the MEMBER_NOT_FOUND outcome
  when the number searched is not on file. Both are answers. A caller has to
  handle both, and neither is an error — see the outcomes section below.

  Read-only. Nothing in this capability changes anything in the core banking
  system: every action is a navigation, a search field, or a reading. That is
  what makes it safe to replay unattended.

  Written by hand at ticket 03, before Discovery existed, so that the artifact
  schema had to be genuinely executable before anything started generating one.
  Ticket 11's compiler emits documents of exactly this shape from a real
  discovery run.

# Which kind of surface, and where the flow starts. Deliberately no origin: which
# institution's installation this runs against is supplied at replay time, so the
# same document serves every tenant running this vendor product.
surface:
  kind: web
  product: Heritage Core Member Services (MSS 4.02.11)
  entry: /

inputs:
  memberId:
    type: string
    description: >
      The member's account number as an operator would read it off a statement.
      Heritage Core's own member number, not a legacy cross-reference number.
    # Sensitive by default. Stated explicitly here because a reviewer should not
    # have to know the default to know the answer. See ADR-0008.
    sensitive: true
    required: true
    pattern: "^[0-9]{4,10}$"
    discoveredFrom: >
      Hand-written at 1.0.0. Ticket 11 derives this from the provenance the
      discovery agent recorded against the value it typed into the search field.

outputs:
  availableBalance:
    type: money
    currency: USD
    description: >
      Funds the member can withdraw right now. This is the figure to quote to a
      member asking what they can spend.
    from:
      step: read-available-balance

  currentBalance:
    type: money
    currency: USD
    description: >
      The ledger balance, including deposits that have not yet cleared. Larger
      than the available balance when a hold is in force.
    from:
      step: read-current-balance

# The other half of this capability's signature. `outputs` above says what comes
# back when the flow completes; this says what comes back when Heritage Core's own
# domain answers something else instead.
#
# Every code here is reachable from an `orOutcome` branch on some step's
# checkpoint below, and every branch's code appears here. The artifact is rejected
# at parse time if either is untrue, so this list is the complete set of values a
# caller can receive besides the balances — not a sample of them.
outcomes:
  MEMBER_NOT_FOUND:
    title: No member record exists for the number searched.
    summary: >
      The search ran, Heritage Core understood it, and the answer is that the
      credit union has no member with that number. Nothing is broken and nothing
      needs looking at: this is a fact about the membership, and it is the answer
      a caller asked for as much as a balance would have been.

      A caller should treat this the way a teller does — tell the member the
      number was not found and check it with them. It is not a condition to retry,
      escalate or page anyone about, and a run that ends here has succeeded.

      Worth knowing how invisible this is from outside the screen: Heritage Core
      answers it with HTTP 200 and a perfectly well-formed page. Nothing throws,
      nothing times out, and no status code distinguishes it from a member who
      does exist. It is recognisable only by reading the screen, which is why the
      recognition lives in a checkpoint branch and not in error handling.
    discoveredFrom: >
      Hand-written at 1.0.0 alongside the rest of this document. In the shape
      ticket 11's compiler will emit, this field records the intervention that
      produced the outcome: the operator who met this screen, observed it,
      changed nothing and returned control, and the confirmation that made it
      declarable rather than an escalation.

steps:
  # ---------------------------------------------------------------------------
  - id: open-member-search
    intent: Land on the Member Services search screen with an empty search form.
    action:
      type: navigate
      path:
        from: constant
        text: /
    checkpoint:
      description: The Member Number Search panel is on screen and ready to accept a number.
      expect:
        - assert: textPresent
          text: Member Number Search
        - assert: targetPresent
          target:
            role: textbox
            name: Member Number
            within:
              name: Member Number Search
            strategy: scoped-accessible-name
            robustness: >
              Heritage Core has no labels, ids or test hooks; the accessible name
              comes from the input's title attribute, which is what a screen
              reader would announce and therefore the most stable thing about it.

              The scope is load-bearing rather than decorative. The same screen
              carries a Cross-Reference Lookup panel with a field named
              "Member Number (Legacy)", and a partial name match returns both.
              Scoping to the panel the caption "Member Number Search" heads picks
              the right one. Choosing wrong submits to /xref, which returns a
              perfectly valid page that is not Member Detail — a failure nothing
              would raise an exception about.

  # ---------------------------------------------------------------------------
  - id: enter-member-number
    intent: Type the member number into the search panel's own number field.
    action:
      type: fill
      target:
        role: textbox
        name: Member Number
        within:
          name: Member Number Search
        strategy: scoped-accessible-name
        robustness: >
          The same target as the checkpoint above, for the same reasons. The
          field's neighbour in this panel is a Branch box that already carries a
          default, so an ordinal would be fragile where the name is not.
      value:
        from: parameter
        name: memberId
    checkpoint:
      description: The member number is sitting in the search field, not in the legacy one.
      expect:
        - assert: targetReads
          target:
            role: textbox
            name: Member Number
            within:
              name: Member Number Search
            strategy: scoped-accessible-name
            robustness: >
              Reading the value back out of the same control that was filled is
              what makes the fill verifiable. Typing into the wrong field is the
              failure a screen full of near-duplicate captions actually produces,
              and it raises nothing at all.
          equals:
            from: parameter
            name: memberId

  # ---------------------------------------------------------------------------
  - id: run-member-search
    intent: Submit the search and arrive at the member's record.
    action:
      type: click
      target:
        role: button
        name: Search
        strategy: accessible-name
        robustness: >
          The submit control's accessible name comes from its value attribute.
          The Cross-Reference panel's submit reads "Look Up", so no scope is
          needed here — but note that a tenant whose button reads "Find" has no
          token in common with "Search" and will not resolve. That is a genuine
          incompatibility rather than a cosmetic one, and it is meant to surface
          as an ordinary replay failure.
    checkpoint:
      description: Member Detail is showing, and the search screen is behind us.
      expect:
        - assert: textPresent
          text: Member Detail
        # Asserting the search screen is *gone* is how this step proves it
        # navigated. Without it, a page that merely shares a caption with the
        # previous one would pass.
        - assert: textAbsent
          text: Cross-Reference Lookup
        - assert: targetPresent
          target:
            role: cell
            name: Share and Deposit Accounts
            strategy: accessible-name
            robustness: >
              The account list's own heading cell. Present on every member record
              regardless of how many accounts the member holds, so it confirms we
              are on Member Detail rather than confirming this member's data.
      # The other screen this submit legitimately reaches. Tried only when the
      # expectation above does not hold, so a member record can never be re-read
      # as an absence.
      orOutcome:
        - code: MEMBER_NOT_FOUND
          when:
            # The screen heading. Heritage Core's own words for this state, and
            # the thing an operator reads first.
            - assert: textPresent
              text: Member Not Found
            # And the message under it, so the branch cannot be satisfied by a
            # heading alone on some future screen that borrows the phrase. The
            # assertion stops before the number itself: the sentence opener is
            # screen text, the number is this run's input, and an artifact carries
            # no runtime data.
            - assert: textPresent
              text: No member record found for member number

  # ---------------------------------------------------------------------------
  # SEAM — ticket 09 replaces this single step with a generic selectFromList over
  # the account list, matching an `accountType` parameter by token subset against
  # the live labels. Nothing else in this artifact changes when it does.
  - id: open-savings-account
    intent: Open the member's primary savings account.
    action:
      type: click
      target:
        role: link
        name: Primary Savings
        strategy: accessible-name
        robustness: >
          Each account in the list is a link whose accessible name is the
          account's description as the institution configured it. "Primary
          Savings" is that description here, and it is a screen label rather than
          a runtime value, so it belongs in the artifact.

          This is the least robust target in the flow, and knowingly so: a tenant
          calling the same account "Regular Savings" breaks it. Ticket 09
          replaces this with token-subset matching against the live list, which
          absorbs that difference without an override.
    checkpoint:
      description: Account Detail is showing, with the balance panel loaded inside its frame.
      expect:
        - assert: textPresent
          text: Account Detail
        - assert: targetPresent
          target:
            role: cell
            label: Available Balance
            strategy: caption-label
            robustness: >
              Waiting for the balance cell itself, not merely for the page title,
              because the figures live in a separate document inside an iframe
              that loads after its parent. Asserting on the outer chrome would
              pass while the panel was still blank.

  # ---------------------------------------------------------------------------
  - id: read-available-balance
    intent: Read the available balance out of the account panel.
    action:
      type: extract
      target:
        role: cell
        label: Available Balance
        strategy: caption-label
        robustness: >
          Heritage Core lays every figure out as a caption cell followed by a
          value cell, with no markup relating the two. `label` is the strategy
          that reads that pattern: it finds the value cell whose preceding
          non-control leaf in the same row is the caption "Available Balance".

          Frame-agnostic. This cell is inside an unnamed iframe and the target
          says nothing about that, which is what lets a tenant that renders the
          panel inline match the same description.
    checkpoint:
      description: A currency amount was read, not an empty cell or a system message.
      expect:
        # An extract that quietly returns "" or "N/A" is the silent failure mode
        # of reading a screen. Asserting the shape of what came back is the only
        # thing that catches it.
        - assert: stepRead
          step: read-available-balance
          matches: "^\\$[0-9,]+\\.[0-9]{2}$"

  # ---------------------------------------------------------------------------
  - id: read-current-balance
    intent: Read the current ledger balance out of the same panel.
    action:
      type: extract
      target:
        role: cell
        label: Current Balance
        strategy: caption-label
        robustness: >
          The same caption-cell pattern as the available balance, one row down.
          Kept as a separate step rather than folded into the one above because a
          step is the unit that carries a checkpoint, and each figure deserves
          its own.
    checkpoint:
      description: A second currency amount was read.
      expect:
        - assert: stepRead
          step: read-current-balance
          matches: "^\\$[0-9,]+\\.[0-9]{2}$"
