# Capability Artifact — member.account-balance 1.1.0
#
# Read this document instead of the code. It is meant to be approvable on its own:
# what the capability does, what it needs, what it returns, how each step verifies
# itself, and why each control is identified the way it is.
#
# Immutable. A change is a new version file beside this one, so 1.0.0 and 1.1.0
# can be diffed and the difference read directly.
#
# WHAT CHANGED FROM 1.0.0
#
# One step and one input. `open-savings-account` clicked a link whose name was
# written into this document — "Primary Savings" — which is a tenant's label
# sitting in a vendor-level capability, and the least robust thing in the flow.
# It is now `open-account`, a generic `selectFromList` that reads whatever the
# account list currently offers and picks the item matching the `accountType`
# parameter by token subset (ADR-0007).
#
# Three consequences a reviewer should check for themselves:
#
#   1. The capability now serves every account type, not just savings. The same
#      six steps return the checking balance when called with `accountType`
#      "Checking", with no second discovery run.
#   2. A tenant labelling the account "Regular Savings" still matches "Savings",
#      so most tenant variation needs no override at all.
#   3. Nothing is hardcoded that was not hardcoded before — less, in fact. The
#      legal values below were read off the account list during discovery, and
#      the default records the goal's own word.

capability: member.account-balance
version: 1.1.0
title: Read a member's account balance
authored: hand-written

summary: >
  Looks a member up by number in Heritage Core Member Services, opens one of
  their accounts, and reads back the available and current balances. Which
  account is a parameter; omitted, it is the member's savings account, because
  that is what the goal this capability was discovered from asked for.

  Read-only. Nothing in this capability changes anything in the core banking
  system: every action is a navigation, a search field, a selection, or a
  reading. That is what makes it safe to replay unattended.

  Written by hand at ticket 03, before Discovery existed, so that the artifact
  schema had to be genuinely executable before anything started generating one.
  Ticket 11's compiler emits documents of exactly this shape from a real
  discovery run.

# Which kind of surface, and where the flow starts. Deliberately no origin: which
# institution's installation this runs against is supplied at replay time, so the
# same document serves every tenant running this vendor product.
surface:
  kind: web
  product: Heritage Core Member Services (MSS 4.02.11)
  entry: /

inputs:
  memberId:
    type: string
    description: >
      The member's account number as an operator would read it off a statement.
      Heritage Core's own member number, not a legacy cross-reference number.
    # Sensitive by default. Stated explicitly here because a reviewer should not
    # have to know the default to know the answer. See ADR-0008.
    sensitive: true
    required: true
    pattern: "^[0-9]{4,10}$"
    discoveredFrom: >
      Hand-written at 1.0.0. Ticket 11 derives this from the provenance the
      discovery agent recorded against the value it typed into the search field.

  accountType:
    type: enum
    description: >
      Which of the member's accounts to read. Say as little as identifies it:
      "Savings" and "Checking" are what a caller means, and the screen's own
      wording for the same product varies between institutions.
    # A screen label, not a runtime value. It names a product an institution
    # offers, carries nothing about who the member is, and appears verbatim in
    # every screenshot of the account list, so classifying it sensitive would
    # scrub a word that is already public and make the record harder to read for
    # no protection at all. Stated in writing because the default is `true`
    # (ADR-0008).
    sensitive: false
    required: false
    # Read off the account list on Member Detail during discovery, not written
    # here by a human choosing what ought to be allowed. Legality is judged by
    # the same token-subset rule selection uses, so "Savings" is a legal way to
    # ask for "Primary Savings" while "Money Market" is refused before a browser
    # opens.
    values: ["Primary Savings", "Checking"]
    # The goal said "savings", and the goal's own word is what gets recorded —
    # not the label it happened to match here. That is what makes the default
    # portable: a tenant labelling the account "Regular Savings" still matches
    # it, so the capability's out-of-the-box behaviour survives the move with no
    # override. Recording "Primary Savings" instead would have quietly turned
    # one institution's vocabulary into the contract.
    default: Savings
    discoveredFrom: >
      goal term 'savings' ⊂ label 'Primary Savings'. The account list offered
      "Primary Savings" and "Checking"; the goal asked for the savings balance;
      the only label carrying the token 'savings' was "Primary Savings". That
      inference was made once, by the model, at discovery time, and recorded
      here. Replay never repeats it — it matches tokens against the live list.

outputs:
  availableBalance:
    type: money
    currency: USD
    description: >
      Funds the member can withdraw right now. This is the figure to quote to a
      member asking what they can spend.
    from:
      step: read-available-balance

  currentBalance:
    type: money
    currency: USD
    description: >
      The ledger balance, including deposits that have not yet cleared. Larger
      than the available balance when a hold is in force.
    from:
      step: read-current-balance

steps:
  # ---------------------------------------------------------------------------
  - id: open-member-search
    intent: Land on the Member Services search screen with an empty search form.
    action:
      type: navigate
      path:
        from: constant
        text: /
    checkpoint:
      description: The Member Number Search panel is on screen and ready to accept a number.
      expect:
        - assert: textPresent
          text: Member Number Search
        - assert: targetPresent
          target:
            role: textbox
            name: Member Number
            within:
              name: Member Number Search
            strategy: scoped-accessible-name
            robustness: >
              Heritage Core has no labels, ids or test hooks; the accessible name
              comes from the input's title attribute, which is what a screen
              reader would announce and therefore the most stable thing about it.

              The scope is load-bearing rather than decorative. The same screen
              carries a Cross-Reference Lookup panel with a field named
              "Member Number (Legacy)", and a partial name match returns both.
              Scoping to the panel the caption "Member Number Search" heads picks
              the right one. Choosing wrong submits to /xref, which returns a
              perfectly valid page that is not Member Detail — a failure nothing
              would raise an exception about.

  # ---------------------------------------------------------------------------
  - id: enter-member-number
    intent: Type the member number into the search panel's own number field.
    action:
      type: fill
      target:
        role: textbox
        name: Member Number
        within:
          name: Member Number Search
        strategy: scoped-accessible-name
        robustness: >
          The same target as the checkpoint above, for the same reasons. The
          field's neighbour in this panel is a Branch box that already carries a
          default, so an ordinal would be fragile where the name is not.
      value:
        from: parameter
        name: memberId
    checkpoint:
      description: The member number is sitting in the search field, not in the legacy one.
      expect:
        - assert: targetReads
          target:
            role: textbox
            name: Member Number
            within:
              name: Member Number Search
            strategy: scoped-accessible-name
            robustness: >
              Reading the value back out of the same control that was filled is
              what makes the fill verifiable. Typing into the wrong field is the
              failure a screen full of near-duplicate captions actually produces,
              and it raises nothing at all.
          equals:
            from: parameter
            name: memberId

  # ---------------------------------------------------------------------------
  - id: run-member-search
    intent: Submit the search and arrive at the member's record.
    action:
      type: click
      target:
        role: button
        name: Search
        strategy: accessible-name
        robustness: >
          The submit control's accessible name comes from its value attribute.
          The Cross-Reference panel's submit reads "Look Up", so no scope is
          needed here — but note that a tenant whose button reads "Find" has no
          token in common with "Search" and will not resolve. That is a genuine
          incompatibility rather than a cosmetic one, and it is meant to surface
          as an ordinary replay failure.
    checkpoint:
      description: Member Detail is showing, and the search screen is behind us.
      expect:
        - assert: textPresent
          text: Member Detail
        # Asserting the search screen is *gone* is how this step proves it
        # navigated. Without it, a page that merely shares a caption with the
        # previous one would pass.
        - assert: textAbsent
          text: Cross-Reference Lookup
        - assert: targetPresent
          target:
            role: cell
            name: Share and Deposit Accounts
            strategy: accessible-name
            robustness: >
              The account list's own heading cell. Present on every member record
              regardless of how many accounts the member holds, so it confirms we
              are on Member Detail rather than confirming this member's data.

  # ---------------------------------------------------------------------------
  - id: open-account
    intent: Open the account the caller asked for, whichever of them that is.
    action:
      type: selectFromList
      # Which items are on offer. Not which item is wanted — that is the
      # parameter's job, and keeping the two apart is what makes this one step
      # serve every account type.
      list:
        within:
          name: Share and Deposit Accounts
        itemRole: link
      match:
        against:
          from: parameter
          name: accountType
        strategy: tokenSubset
      # Both ways this can fail to land on exactly one item, declared rather than
      # discovered at 3am. They are different facts about the world and they
      # escalate under different codes.
      onNoMatch:
        escalate: NO_MATCHING_ITEM
      onMultiple:
        escalate: AMBIGUOUS_MATCH
      robustness: >
        The account list is a table headed by the caption "Share and Deposit
        Accounts", and each account is a link whose accessible name is the
        description the institution configured. Scoping to that table is what
        keeps the "Return to Member Search" link at the foot of the page out of
        the candidate set; the caption is a childless cell in the table's first
        row, and the scope rule climbs from it to the table it heads.

        Matching is token subset against the live labels, in one direction: every
        token of the parameter must appear in the label. "Savings" therefore
        selects "Primary Savings" here and "Regular Savings" at an institution
        that names it that way, which is the whole reason this is a selection
        rather than a click on a name written into this document. The previous
        version clicked a link literally named "Primary Savings" and was the
        least robust step in the flow.

        What would break it: an institution that renames the panel heading, or
        one that renders accounts as plain text rather than links. What will not
        break it: a different label for the account itself, a different number of
        accounts, or a different order. Two accounts whose labels both carry
        every token of the parameter stop the run and list both, rather than
        opening one of them and returning a balance for an account nobody asked
        for.
    checkpoint:
      description: Account Detail is showing, with the balance panel loaded inside its frame.
      expect:
        - assert: textPresent
          text: Account Detail
        - assert: targetPresent
          target:
            role: cell
            label: Available Balance
            strategy: caption-label
            robustness: >
              Waiting for the balance cell itself, not merely for the page title,
              because the figures live in a separate document inside an iframe
              that loads after its parent. Asserting on the outer chrome would
              pass while the panel was still blank.

  # ---------------------------------------------------------------------------
  - id: read-available-balance
    intent: Read the available balance out of the account panel.
    action:
      type: extract
      target:
        role: cell
        label: Available Balance
        strategy: caption-label
        robustness: >
          Heritage Core lays every figure out as a caption cell followed by a
          value cell, with no markup relating the two. `label` is the strategy
          that reads that pattern: it finds the value cell whose preceding
          non-control leaf in the same row is the caption "Available Balance".

          Frame-agnostic. This cell is inside an unnamed iframe and the target
          says nothing about that, which is what lets a tenant that renders the
          panel inline match the same description.
    checkpoint:
      description: A currency amount was read, not an empty cell or a system message.
      expect:
        # An extract that quietly returns "" or "N/A" is the silent failure mode
        # of reading a screen. Asserting the shape of what came back is the only
        # thing that catches it.
        - assert: stepRead
          step: read-available-balance
          matches: "^\\$[0-9,]+\\.[0-9]{2}$"

  # ---------------------------------------------------------------------------
  - id: read-current-balance
    intent: Read the current ledger balance out of the same panel.
    action:
      type: extract
      target:
        role: cell
        label: Current Balance
        strategy: caption-label
        robustness: >
          The same caption-cell pattern as the available balance, one row down.
          Kept as a separate step rather than folded into the one above because a
          step is the unit that carries a checkpoint, and each figure deserves
          its own.
    checkpoint:
      description: A second currency amount was read.
      expect:
        - assert: stepRead
          step: read-current-balance
          matches: "^\\$[0-9,]+\\.[0-9]{2}$"
