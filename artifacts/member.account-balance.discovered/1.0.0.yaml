capability: member.account-balance.discovered
version: 1.0.0
title: Reads the available balance of a member's savings account
summary: |-
  Reads the available balance of a member's savings account

  Compiled from discovery run scripted-model-no-llm-drove-this, whose evidence is at evidence/discovery/scripted-model-no-llm-drove-this. Every step below is an action that run took and a check that it landed; every input below was derived from the origin the run recorded against a value it used, not declared in advance by a person. No value from that run survives in this document.

  Nothing here has been reviewed yet. It declares no business outcomes and no recoverable conditions, because one successful run has demonstrated neither, and a capability learns those from what a person had to do about them.
authored: discovered
surface:
  kind: web
  product: Heritage Core Member Services (MSS 4.02.11)
  entry: "/"
inputs:
  memberId:
    type: string
    description: >-
      Supplied by the caller. Discovered as the value step fill-1 took from the goal, and
      named "memberId" by the model that read it — the semantic role it plays, in a caller's
      vocabulary rather than the screen's.
    sensitive: true
    required: true
    discoveredFrom: >-
      Derived from the provenance recorded against the value at the step that used it: the
      discovery run tagged it as coming from the goal and named the parameter it should
      become. No format is declared for it, deliberately — one run saw one value, and a
      pattern inferred from a single example would reject the second caller.
  accountType:
    type: enum
    description: >-
      Which item to choose from the list on screen. The legal values below were read off that
      list during discovery rather than written here by a human deciding what ought to be
      allowed, and a value is legal if every word of it appears in one of them — so a shorter,
      more portable word than the label is the right thing to pass.
    sensitive: true
    required: false
    values:
    - Primary Savings
    - Checking
    default: savings
    discoveredFrom: >-
      goal term 'savings' matched label 'Primary Savings'. The list offered "Primary Savings",
      "Checking", and the default matched "Primary Savings" on the run that discovered this —
      which is this institution's word for it and is deliberately NOT what the default
      records. The inference was made once, by the model, at discovery time. Replay never
      repeats it: it matches the default's tokens against whatever the live list offers.
outputs:
  availableBalance:
    type: money
    description: the account's available balance
    from:
      step: read-available-balance
    currency: USD
steps:
- id: open
  intent: Open the application at the entry path this capability starts from.
  action:
    type: navigate
    path:
      from: constant
      text: "/"
  checkpoint:
    description: >-
      The control the next step acts on is on screen: textbox "Member Number" within "Member
      Number Search".
    expect:
    - assert: targetPresent
      target:
        role: textbox
        name: Member Number
        within:
          name: Member Number Search
        strategy: scoped-accessible-name
        robustness: >-
          Identified by scoped-accessible-name. The adapter narrowed to it like this: scoped to
          the table headed "Member Number Search"; 2 node(s) with role textbox; 1 named exactly
          "Member Number". No other control on the screen answered to this description, so it
          named exactly one thing on the run that discovered it. It is described by an ARIA role,
          the accessible name a screen reader would announce, the caption of the region it sits in
          and by nothing else: there is no selector, id, class or coordinate here, so a change to
          the markup leaves it working (ADR-0001). What would break it is the screen saying
          something different — a renamed control, a renamed region, or a control that stops being
          a textbox.
- id: fill-1
  intent: enter the member number
  action:
    type: fill
    target:
      role: textbox
      name: Member Number
      within:
        name: Member Number Search
      strategy: scoped-accessible-name
      robustness: >-
        Identified by scoped-accessible-name. The adapter narrowed to it like this: scoped to
        the table headed "Member Number Search"; 2 node(s) with role textbox; 1 named exactly
        "Member Number". No other control on the screen answered to this description, so it
        named exactly one thing on the run that discovered it. It is described by an ARIA role,
        the accessible name a screen reader would announce, the caption of the region it sits in
        and by nothing else: there is no selector, id, class or coordinate here, so a change to
        the markup leaves it working (ADR-0001). What would break it is the screen saying
        something different — a renamed control, a renamed region, or a control that stops being
        a textbox.
    value:
      from: parameter
      name: memberId
  checkpoint:
    description: The value is sitting in the control that was filled, and not in a neighbouring one.
    expect:
    - assert: targetReads
      target:
        role: textbox
        name: Member Number
        within:
          name: Member Number Search
        strategy: scoped-accessible-name
        robustness: >-
          Identified by scoped-accessible-name. The adapter narrowed to it like this: scoped to
          the table headed "Member Number Search"; 2 node(s) with role textbox; 1 named exactly
          "Member Number". No other control on the screen answered to this description, so it
          named exactly one thing on the run that discovered it. It is described by an ARIA role,
          the accessible name a screen reader would announce, the caption of the region it sits in
          and by nothing else: there is no selector, id, class or coordinate here, so a change to
          the markup leaves it working (ADR-0001). What would break it is the screen saying
          something different — a renamed control, a renamed region, or a control that stops being
          a textbox.
      equals:
        from: parameter
        name: memberId
- id: click-2
  intent: run the member search
  action:
    type: click
    target:
      role: button
      name: Search
      within:
        name: Member Number Search
      strategy: scoped-accessible-name
      robustness: >-
        Identified by scoped-accessible-name. The adapter narrowed to it like this: scoped to
        the table headed "Member Number Search"; 1 node(s) with role button; 1 named exactly
        "Search". No other control on the screen answered to this description, so it named
        exactly one thing on the run that discovered it. It is described by an ARIA role, the
        accessible name a screen reader would announce, the caption of the region it sits in and
        by nothing else: there is no selector, id, class or coordinate here, so a change to the
        markup leaves it working (ADR-0001). What would break it is the screen saying something
        different — a renamed control, a renamed region, or a control that stops being a button.
  checkpoint:
    description: "The screen the next step chooses from is showing: \"Share and Deposit Accounts\"."
    expect:
    - assert: textPresent
      text: Share and Deposit Accounts
- id: selectFromList-3
  intent: open the savings account
  action:
    type: selectFromList
    list:
      within:
        name: Share and Deposit Accounts
      itemRole: link
    match:
      against:
        from: parameter
        name: accountType
      strategy: tokenSubset
    onNoMatch:
      escalate: NO_MATCHING_ITEM
    onMultiple:
      escalate: AMBIGUOUS_MATCH
    robustness: >-
      The account list is the only table of links on Member Detail, and matching by token
      subset against the goal's own word survives a tenant that labels the same account
      differently. Observed at discovery: scoped to the table headed "Share and Deposit
      Accounts"; 2 link(s) on offer: "Primary Savings", "Checking"; every token of the value
      being matched is in "Primary Savings"; scoped to the table headed "Share and Deposit
      Accounts"; 2 node(s) with role link; 1 named exactly "Primary Savings". Matching is
      token subset in one direction — every word of the parameter must appear in the item's
      label — so an institution that words the same item differently still matches, and two
      items that both match stop the run rather than one of them being opened.
  checkpoint:
    description: "The control the next step acts on is on screen: cell labelled \"Available Balance\"."
    expect:
    - assert: targetPresent
      target:
        role: cell
        label: Available Balance
        strategy: caption-label
        robustness: >-
          Identified by caption-label. The adapter narrowed to it like this: 24 node(s) with role
          cell; 1 captioned "Available Balance" by the preceding cell in their row. No other
          control on the screen answered to this description, so it named exactly one thing on the
          run that discovered it. It is described by an ARIA role, the caption cell sitting beside
          the value and by nothing else: there is no selector, id, class or coordinate here, so a
          change to the markup leaves it working (ADR-0001). What would break it is the screen
          saying something different — a renamed control, a renamed region, or a control that
          stops being a cell.
- id: read-available-balance
  intent: read the available balance
  action:
    type: extract
    target:
      role: cell
      label: Available Balance
      strategy: caption-label
      robustness: >-
        Identified by caption-label. The adapter narrowed to it like this: 24 node(s) with role
        cell; 1 captioned "Available Balance" by the preceding cell in their row. No other
        control on the screen answered to this description, so it named exactly one thing on the
        run that discovered it. It is described by an ARIA role, the caption cell sitting beside
        the value and by nothing else: there is no selector, id, class or coordinate here, so a
        change to the markup leaves it working (ADR-0001). What would break it is the screen
        saying something different — a renamed control, a renamed region, or a control that
        stops being a cell.
  checkpoint:
    description: >-
      A reading came back in the shape this reading had when the capability was discovered,
      rather than an empty cell, a placeholder or a system message.
    expect:
    - assert: stepRead
      step: read-available-balance
      matches: "^\\$\\s*-?[0-9,]+\\.[0-9]{2}$"
